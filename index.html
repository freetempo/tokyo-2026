<style>
/* 淺色的色票；預設 data-theme="system"，所以系統淺色時會落在這裡 */
:root, :root[data-theme="light"]{
  --paper:#f7f4ee; --card:#fff; --ink:#1e1c19; --ink-soft:#6a655d;
  --line:#e3ddd2; --accent:#1b4965; --accent-soft:#e8eef3;
  --warm:#c1502e; --warm-soft:#fbeae4; --good:#3f7d52; --good-soft:#e8f1ea;
  --shadow:0 1px 2px rgba(31,29,26,.06),0 4px 14px rgba(31,29,26,.05);
  color-scheme:light;
}
/* 手動選深色 */
:root[data-theme="dark"]{
  --paper:#16151a; --card:#1f1e24; --ink:#eceae5; --ink-soft:#a09a90;
  --line:#332f38; --accent:#7fb3d3; --accent-soft:#1e2a33;
  --warm:#e88a68; --warm-soft:#33211b; --good:#7fba92; --good-soft:#1c2a20;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  color-scheme:dark;
}
/* 選「跟隨系統」時才看系統設定 */
:root[data-theme="system"]{color-scheme:light dark}
@media (prefers-color-scheme:dark){
  :root[data-theme="system"]{
    --paper:#16151a; --card:#1f1e24; --ink:#eceae5; --ink-soft:#a09a90;
    --line:#332f38; --accent:#7fb3d3; --accent-soft:#1e2a33;
    --warm:#e88a68; --warm-soft:#33211b; --good:#7fba92; --good-soft:#1c2a20;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Hiragino Sans",sans-serif;
  -webkit-text-size-adjust:100%;
  padding:0 0 64px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ---- header ---- */
header{padding:28px 0 4px}
.hrow{display:flex;align-items:flex-start;gap:12px}
.hrow>div{flex:1 1 auto;min-width:0}
h1{font-size:26px;line-height:1.3;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--ink-soft);font-size:14px;margin:0}
.themebtn{
  flex:0 0 auto;margin-top:2px;border:1px solid var(--line);background:var(--card);
  color:var(--ink-soft);border-radius:11px;padding:7px 11px;font:inherit;font-size:13px;
  font-weight:700;cursor:pointer;line-height:1.3;white-space:nowrap;box-shadow:var(--shadow);
}
.themebtn:active{transform:scale(.96)}
.countdown{
  display:inline-block;margin-top:12px;padding:5px 12px;border-radius:999px;
  background:var(--warm-soft);color:var(--warm);font-size:13px;font-weight:700;
}

/* ---- day nav ---- */
nav{margin:18px -16px 0;padding:0 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
.pills{display:flex;gap:8px;padding-bottom:4px;width:max-content}
.pill{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:12px;padding:8px 13px;font:inherit;font-size:14px;cursor:pointer;
  text-align:center;line-height:1.35;
}
.pill b{display:block;font-size:13px;color:var(--ink)}
.pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.on b{color:#fff}
.pill.today::after{content:"·今天";font-size:11px;color:var(--warm);font-weight:700}
.pill.on.today::after{color:#ffd9cc}

/* ---- panels ---- */
.panel{display:none;padding-top:22px}
.panel.on{display:block}
.dayhead{margin:0 0 14px}
.dayhead h2{font-size:21px;margin:0 0 6px;letter-spacing:-.01em}
.dayhead .meta{font-size:14px;color:var(--ink-soft);margin:0}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;margin:0 0 12px;box-shadow:var(--shadow);
}
.card h3{font-size:16px;margin:0 0 8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h3 .t{
  font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);
  padding:2px 8px;border-radius:7px;font-variant-numeric:tabular-nums;
}
.card p{margin:0 0 10px}
.card p:last-child,.card ul:last-child,.card ol:last-child{margin-bottom:0}
.card ul,.card ol{margin:0 0 10px;padding-left:1.35em}
.card li{margin:0 0 4px}

/* ---- timeline ---- */
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:flex;gap:12px;padding:0 0 4px}
.tl .time{
  flex:0 0 52px;text-align:right;font-size:13px;font-weight:700;color:var(--accent);
  font-variant-numeric:tabular-nums;padding-top:3px;
}
.tl .time.blank{color:var(--line)}
.tl .body{flex:1 1 auto;border-left:2px solid var(--line);padding:0 0 16px 14px;position:relative}
.tl>li:last-child .body{border-color:transparent;padding-bottom:0}
.tl .body::before{
  content:"";position:absolute;left:-6px;top:8px;width:10px;height:10px;border-radius:50%;
  background:var(--card);border:2px solid var(--accent);
}
.tl .what{font-weight:700}
.tl .note{font-size:14px;color:var(--ink-soft)}

/* ---- tags & links ---- */
.tag{
  display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:7px;
  margin:0 4px 4px 0;white-space:nowrap;
}
.tag.book{background:var(--good-soft);color:var(--good)}
.tag.stroll{background:var(--accent-soft);color:var(--accent)}
.tag.check{background:var(--warm-soft);color:var(--warm)}
a{color:var(--accent)}
.map{
  display:inline-block;font-size:13px;font-weight:700;text-decoration:none;
  border:1px solid var(--line);border-radius:9px;padding:5px 11px;margin:6px 6px 0 0;
  color:var(--accent);background:var(--paper);
}

/* ---- collapsible ---- */
details{border:1px solid var(--line);border-radius:14px;background:var(--card);margin:0 0 12px;box-shadow:var(--shadow);overflow:hidden}
details>summary{
  padding:14px 16px;cursor:pointer;font-weight:700;list-style:none;
  display:flex;align-items:center;gap:9px;
}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";margin-left:auto;color:var(--ink-soft);font-weight:400}
details[open]>summary::after{content:"－"}
details>summary .n{
  flex:0 0 24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);
  display:grid;place-items:center;font-size:13px;
}
.dbody{padding:0 16px 16px;border-top:1px solid var(--line);margin-top:-1px;padding-top:14px}
.dbody h4{font-size:14px;margin:14px 0 6px;color:var(--warm)}
.dbody h4:first-child{margin-top:0}
.dbody p{margin:0 0 8px}
.dbody ul{margin:0 0 8px;padding-left:1.35em}

/* ---- callout ---- */
.note-box{
  background:var(--accent-soft);border-radius:12px;padding:13px 15px;margin:0 0 12px;
  font-size:14px;line-height:1.65;
}
.note-box.warm{background:var(--warm-soft)}
.note-box strong{display:block;margin-bottom:3px}
.note-box p{margin:0 0 6px}
.note-box p:last-child{margin:0}
.note-box ul{margin:4px 0 0;padding-left:1.3em}

/* ---- height table ---- */
.ht{width:100%;border-collapse:collapse;font-size:13.5px;margin:0 0 6px}
.ht th{
  text-align:left;font-size:11.5px;color:var(--ink-soft);font-weight:700;
  padding:6px 4px;border-bottom:1px solid var(--line);
}
.ht td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.ht tr:last-child td{border-bottom:0}
.ht th.c,.ht td.c{text-align:center;width:46px}
.ht td.lim{white-space:nowrap;color:var(--ink-soft);font-size:12.5px;width:1%}
.ht .park{font-size:11.5px;color:var(--ink-soft)}
.hgroup{
  font-weight:700;font-size:13px;margin:14px 0 2px;padding:5px 9px;border-radius:8px;
  background:var(--accent-soft);color:var(--accent);display:inline-block;
}
.hgroup.no{background:var(--warm-soft);color:var(--warm)}

/* ---- 店家清單（LaLaport 頁籤） ---- */
.tools{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:10px 0 8px;margin:0 0 4px;border-bottom:1px solid var(--line);
}
.searchrow{display:flex;gap:8px;align-items:center}
#shop-q{
  flex:1 1 auto;min-width:0;font:inherit;font-size:16px;
  padding:11px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--ink);
}
#shop-q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.clear{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:11px;padding:10px 12px;font:inherit;font-size:14px;cursor:pointer;
}
.chips{display:flex;gap:6px;overflow-x:auto;padding:9px 0 2px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
  border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap;
}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.count{font-size:13px;color:var(--ink-soft);padding:6px 0 0}
.sgroup{margin:20px 0 0}
.sgroup h3{
  font-size:14px;margin:0 0 8px;color:var(--accent);
  background:var(--accent-soft);display:inline-block;padding:5px 11px;border-radius:9px;
}
.sgroup h3 span{font-weight:400;opacity:.75}
.slist{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.shop{display:flex;gap:10px;align-items:baseline;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.shop:last-child{border-bottom:0}
.shop:active{background:var(--accent-soft)}
.shop .nm{flex:1 1 auto;min-width:0;font-weight:700;font-size:15px;word-break:break-word}
.shop .ct{flex:0 0 auto;font-size:11.5px;color:var(--ink-soft);text-align:right;max-width:38%}
.shop .fl{display:block;font-size:11.5px;color:var(--ink-soft);font-weight:400;margin-top:2px}
.shop.star{background:var(--warm-soft)}
.shop.star .nm::before{content:"⭐ "}
.shop .why{display:block;font-size:12px;color:var(--warm);font-weight:700;margin-top:3px}
.empty{padding:28px 4px;text-align:center;color:var(--ink-soft);font-size:14px}

/* ---- overview table ---- */
.ov{width:100%;border-collapse:collapse;font-size:14px}
.ov td{padding:11px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.ov tr:last-child td{border-bottom:0}
.ov .d{white-space:nowrap;font-weight:700;width:1%;padding-right:12px;color:var(--accent)}
.ov .h{color:var(--ink-soft);font-size:13px}
.ov a{text-decoration:none;color:inherit}

footer{margin-top:32px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-soft)}
.top{
  position:fixed;right:16px;bottom:16px;width:44px;height:44px;border-radius:50%;
  background:var(--accent);color:#fff;border:0;font-size:18px;box-shadow:var(--shadow);
  display:none;place-items:center;cursor:pointer;z-index:9;
}
.top.show{display:grid}
</style>
</head>

/* ---------- LaLaport 店家清單 ----------
   整段包在 IIFE 裡，只對外露出 Shops.init()，不跟行程頁的變數打到。
   shops.json 只在第一次點進「店家」頁籤時才載，首頁開啟速度不受影響。 */
const Shops = (function () {
  const CATS = ['美食', '服飾', '居家雜貨', '服務・其他'];
  const LOC_ORDER = ['豊洲1 NORTH PORT', '豊洲1 CENTER PORT', '豊洲1 SOUTH PORT', '豊洲2', '豊洲3'];
  const FLOORS = ['B1', '1F', '2F', '3F', '4F'];

  /* 已查證豐洲沒有專門店的品牌 → 指去替代店。
     都是實際比對過 shops.json 才寫的，不要憑印象加。 */
  const ABSENT = [
    { keys: ['gu', 'ジーユー'],
      msg: '豐洲<b>沒有 GU</b>。同集團的 <b>ユニクロ</b> 在 <b>豊洲1 NORTH PORT 2F</b>。' },
    { keys: ['nike', 'ナイキ', 'adidas', 'アディダス', 'newbalance', 'ニューバランス',
             'asics', 'アシックス', 'puma', 'プーマ', 'onitsuka', 'オニツカ',
             'patagonia', 'パタゴニア', 'northface', 'thenorthface', 'ノースフェイス', 'lululemon'],
      msg: '豐洲<b>沒有這些運動品牌的專門店</b>。多品牌大店 <b>スーパースポーツゼビオ</b>'
         + '（豊洲1 NORTH PORT 2F）和鞋類的 <b>ABC-MART</b>（豊洲1 CENTER PORT 2F）'
         + '可以找到這些牌子的商品。' },
    { keys: ['h&m', 'hm'],
      msg: '豐洲<b>沒有 H&amp;M</b>。同類的快時尚有 <b>ZARA</b>（豊洲1 SOUTH PORT 1F）、'
         + '<b>ユニクロ</b> 和 <b>GAP</b>（都在 NORTH PORT 2F）。' },
    { keys: ['loft', 'ロフト', 'nitori', 'ニトリ', '3coins', 'スリーコインズ', 'seria', 'セリア'],
      msg: '豐洲<b>沒有這幾家生活雜貨店</b>。替代：<b>無印良品</b>（豊洲1 SOUTH PORT 2F）、'
         + '<b>ザ・ダイソー</b>（CENTER PORT 3F）、<b>ハンズ</b>（NORTH PORT 1F）。' },
    { keys: ['donki', 'ドンキ', 'ドンキホーテ', 'bic', 'ビックカメラ', 'yodobashi', 'ヨドバシ', 'apple'],
      msg: '豐洲<b>沒有大型電器店</b>，只有 <b>ノジマ</b>（豊洲3 3F）。'
         + '想逛大的：<b>BIC Camera 有楽町店</b>，豐洲搭有樂町線直達約 7 分鐘、出站走 1 分鐘。' },
    { keys: ['pokemon', 'ポケモン', 'jellycat', 'gelatopique', 'ジェラートピケ',
             'snidel', 'スナイデル', 'babiesrus', 'ベビーザらス'],
      msg: '豐洲<b>沒有這家</b>。玩具去 <b>トイザらス</b>（豊洲1 CENTER PORT 3F）、'
         + '嬰幼用品去 <b>アカチャンホンポ</b>（NORTH PORT 3F）。' },
  ];

  let SHOPS = [];
  let started = false;
  let cat = '';
  let loc = '';
  let els = null;

  /* 搜尋用的正規化：全形英數→半形、片假名→平假名、去掉中黑點與空白 */
  function norm(s) {
    return (s || '')
      .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
      .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
      .replace(/[ｰ―－—]/g, 'ー')
      .toLowerCase()
      .replace(/[・･\s　]/g, '');
  }

  function absentHint(nq) {
    if (!nq) return null;
    for (const a of ABSENT) {
      for (const k of a.keys) {
        const nk = norm(k);
        if (nq === nk || (nq.length >= 3 && nk.includes(nq))) return a.msg;
      }
    }
    return null;
  }

  const locKey = s => (s.bld + (s.zone ? ' ' + s.zone : '')).trim();

  function chip(label, on, onclick) {
    const b = document.createElement('button');
    b.className = 'chip' + (on ? ' on' : '');
    b.textContent = label;
    b.onclick = onclick;
    return b;
  }

  function renderChips() {
    els.cats.textContent = '';
    els.cats.appendChild(chip('全部類別', cat === '', () => { cat = ''; render(); }));
    CATS.forEach(c => {
      const n = SHOPS.filter(s => s.cat === c).length;
      if (!n) return;
      els.cats.appendChild(chip(`${c} ${n}`, cat === c, () => { cat = cat === c ? '' : c; render(); }));
    });

    els.locs.textContent = '';
    els.locs.appendChild(chip('全部區域', loc === '', () => { loc = ''; render(); }));
    LOC_ORDER.forEach(k => {
      const n = SHOPS.filter(s => locKey(s) === k).length;
      if (!n) return;
      const short = k.replace('豊洲1 ', '').replace(' PORT', '');
      els.locs.appendChild(chip(`${short} ${n}`, loc === k, () => { loc = loc === k ? '' : k; render(); }));
    });
  }

  function makeList(rows, showLoc) {
    const box = document.createElement('div');
    box.className = 'slist';
    rows.forEach(s => {
      const a = document.createElement('a');
      a.className = 'shop' + (s.star ? ' star' : '');
      if (s.url) { a.href = s.url; a.target = '_blank'; a.rel = 'noopener'; }

      const nm = document.createElement('div');
      nm.className = 'nm';
      nm.textContent = s.name;
      if (showLoc) {
        const fl = document.createElement('span');
        fl.className = 'fl';
        fl.textContent = `${locKey(s)} ${s.floor}`.trim() || '位置未標示';
        nm.appendChild(fl);
      }
      if (s.star) {
        const why = document.createElement('span');
        why.className = 'why';
        why.textContent = s.star;
        nm.appendChild(why);
      }

      const ct = document.createElement('div');
      ct.className = 'ct';
      ct.textContent = s.catRaw || s.cat;

      a.append(nm, ct);
      box.appendChild(a);
    });
    return box;
  }

  function render() {
    const raw = els.q.value;
    const q = norm(raw);
    let rows = SHOPS.filter(s =>
      (!cat || s.cat === cat) &&
      (!loc || locKey(s) === loc) &&
      (!q || norm(s.s || s.name).includes(q) || norm(s.cat).includes(q))
    );

    /* 短關鍵字（例如 gu）在羅馬字裡很容易誤中，店名命中的排前面 */
    if (q) {
      const score = s => {
        const n = norm(s.name);
        if (n === q) return 0;
        if (n.startsWith(q)) return 1;
        if (n.includes(q)) return 2;
        return 3;
      };
      rows = rows.map(s => [score(s), s]).sort((a, b) => a[0] - b[0]).map(x => x[1]);
    }

    renderChips();
    els.count.textContent = `顯示 ${rows.length} / ${SHOPS.length} 家`
      + (q ? `　搜尋「${raw.trim()}」` : '');

    els.out.textContent = '';

    const hint = absentHint(q);
    if (hint && rows.length) {
      const nb = document.createElement('div');
      nb.className = 'note-box warm';
      nb.style.margin = '14px 0 0';
      nb.innerHTML = '<strong>ℹ️ 這個品牌豐洲沒有</strong><p>' + hint
        + '</p><p style="font-size:13px">下面是名稱或羅馬字剛好近似的店。</p>';
      els.out.appendChild(nb);
    }

    if (!rows.length) {
      const d = document.createElement('div');
      d.className = 'empty';
      d.innerHTML = hint
        ? '<b>' + hint + '</b><br><span style="font-size:13px">把搜尋清空可以看全部 '
          + SHOPS.length + ' 家。</span>'
        : '沒有符合的店家。<br><span style="font-size:13px">'
          + '日文店名可以打羅馬字（akachan、uniqlo、starbucks 都可以），或把上面的篩選清掉。</span>';
      els.out.appendChild(d);
      return;
    }

    /* 有搜尋字就攤平成一張清單（跨樓層找店比較快）；否則按區域＋樓層分組 */
    if (q) {
      els.out.appendChild(makeList(rows, true));
      return;
    }

    const groups = new Map();
    rows.forEach(s => {
      const k = locKey(s) + '｜' + (s.floor || '其他');
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(s);
    });

    [...groups.keys()].sort((a, b) => {
      const [la, fa] = a.split('｜'), [lb, fb] = b.split('｜');
      const oa = LOC_ORDER.indexOf(la), ob = LOC_ORDER.indexOf(lb);
      if (oa !== ob) return (oa < 0 ? 99 : oa) - (ob < 0 ? 99 : ob);
      const ia = FLOORS.indexOf(fa), ib = FLOORS.indexOf(fb);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    }).forEach(k => {
      const [l, f] = k.split('｜');
      const sec = document.createElement('section');
      sec.className = 'sgroup';
      const hd = document.createElement('h3');
      hd.innerHTML = `${l} ${f} <span>· ${groups.get(k).length} 家</span>`;
      sec.appendChild(hd);
      sec.appendChild(makeList(groups.get(k), false));
      els.out.appendChild(sec);
    });
  }

  /* 第一次點進「店家」頁籤才載資料 */
  function init() {
    if (started) return;
    started = true;

    els = {
      q: document.getElementById('shop-q'),
      clear: document.getElementById('shop-clear'),
      cats: document.getElementById('shop-cats'),
      locs: document.getElementById('shop-locs'),
      count: document.getElementById('shop-count'),
      out: document.getElementById('shop-out'),
    };
    if (!els.q) { started = false; return; }

    els.q.addEventListener('input', render);
    els.clear.onclick = () => { els.q.value = ''; cat = ''; loc = ''; render(); els.q.focus(); };

    /* 資料由 shops.js 用 <script> 載入（window.SHOPS_DATA），
       不走 fetch —— 離線時最可靠。 */
    const data = window.SHOPS_DATA;
    if (!data || !data.shops) {
      els.count.textContent = '';
      els.out.innerHTML = '<div class="empty">店家資料沒載進來。<br>'
        + '按頁面最下面的「🔄 重新整理」試一次。</div>';
      return;
    }
    SHOPS = data.shops;
    render();
  }

  return { init };
})();

/* ---------- render ---------- */
const pills = document.getElementById('pills');
const panels = document.getElementById('panels');
const todayISO = new Date().toLocaleDateString('sv-SE'); // YYYY-MM-DD, local

TRIP.forEach((d, i) => {
  const b = document.createElement('button');
  b.className = 'pill';
  b.dataset.id = d.id;
  b.innerHTML = `<b>${d.tab}</b>${d.tabSub}${d.dow ? ' ' + d.dow : ''}`;
  if (d.date === todayISO) b.classList.add('today');
  b.onclick = () => show(d.id, true);
  pills.appendChild(b);

  const p = document.createElement('section');
  p.className = 'panel';
  p.id = d.id;
  p.innerHTML = `<div class="dayhead"><h2>${d.title}</h2><p class="meta">${d.meta}</p></div>${d.html}`;
  panels.appendChild(p);
});

function show(id, scroll) {
  TRIP.forEach(d => {
    document.getElementById(d.id).classList.toggle('on', d.id === id);
  });
  if (id === 'shops') Shops.init();
  [...pills.children].forEach(b => b.classList.toggle('on', b.dataset.id === id));
  if (history.replaceState) history.replaceState(null, '', '#!' + id);
  if (scroll) window.scrollTo({ top: 0, behavior: 'smooth' });
  // 只捲 nav 自己，不要動到整頁（載入時頁面亂跳很煩）
  const active = pills.querySelector('.pill.on');
  if (active) {
    const nav = pills.parentElement;
    const left = active.offsetLeft - (nav.clientWidth - active.offsetWidth) / 2;
    nav.scrollTo({ left: Math.max(0, left), behavior: scroll ? 'smooth' : 'auto' });
  }
}

/* 預設開哪一頁：旅程中開今天，其他時候開總覽 */
function defaultPanel() {
  const fromHash = location.hash.replace(/^#!?/, '');
  if (fromHash && TRIP.some(d => d.id === fromHash)) return fromHash;
  const today = TRIP.find(d => d.date === todayISO);
  return today ? today.id : 'ov';
}
show(defaultPanel(), false);

/* footer 等 #panels 外面的連結，還有瀏覽器上一頁／下一頁，都靠 hashchange */
addEventListener('hashchange', () => {
  const id = location.hash.replace(/^#!?/, '');
  if (id && TRIP.some(d => d.id === id) && !document.getElementById(id).classList.contains('on')) {
    show(id, true);
  }
});

/* 總覽表格的內部連結 */
panels.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#!"]');
  if (!a) return;
  e.preventDefault();
  show(a.getAttribute('href').replace(/^#!?/, ''), true);
});

/* 倒數 / 今天是第幾天 */
(function () {
  const el = document.getElementById('cd');
  const start = new Date('2026-09-20T00:00:00+09:00');
  const days = Math.ceil((start - new Date()) / 86400000);
  const inTrip = TRIP.find(d => d.date === todayISO);
  if (inTrip) el.innerHTML = `<span class="countdown">今天是 ${inTrip.tabSub} · ${inTrip.title}</span>`;
  else if (days > 0) el.innerHTML = `<span class="countdown">還有 ${days} 天出發</span>`;
  else el.innerHTML = `<span class="countdown">旅程已結束 · 回顧</span>`;
})();

/* 深淺色切換：跟隨系統 → 淺色 → 深色，記在 localStorage，預設跟隨系統 */
(function () {
  const btn = document.getElementById('theme');
  const order = ['system', 'light', 'dark'];
  const label = { light: '☀️ 淺色', dark: '🌙 深色', system: '⚙️ 系統' };
  const bar = { light: '#f7f4ee', dark: '#16151a' };

  function apply(t) {
    document.documentElement.dataset.theme = t;
    btn.textContent = label[t];
    btn.title = `目前：${label[t].slice(2)}（點一下換下一個）`;
    const dark = t === 'dark' ||
      (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.content = dark ? bar.dark : bar.light;
    try { localStorage.setItem('theme', t); } catch (e) {}
  }

  let cur = 'system';
  try { cur = localStorage.getItem('theme') || 'system'; } catch (e) {}
  if (!order.includes(cur)) cur = 'system';
  apply(cur);

  btn.onclick = () => {
    cur = order[(order.indexOf(cur) + 1) % order.length];
    apply(cur);
  };

  /* 選「系統」時，系統換色也要跟著換狀態列顏色 */
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (document.documentElement.dataset.theme === 'system') apply('system');
  });
})();

/* 重新整理：加入主畫面後沒有網址列，所以自己給一顆。
   做法很土：清掉快取 → 叫 SW 去檢查新版 → 重新載入。
   注意：沒網路時不清快取，否則會把離線內容弄掉。 */
(function () {
  const btn = document.getElementById('refresh');
  if (!btn) return;
  const hint = document.getElementById('refresh-hint');

  btn.onclick = async () => {
    if (!navigator.onLine) {
      if (hint) hint.textContent = '目前沒有網路，先不清快取（免得離線內容不見）。有網路再按。';
      return;
    }
    btn.disabled = true;
    btn.textContent = '更新中…';
    try {
      if (window.caches) {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
      }
      if ('serviceWorker' in navigator) {
        const reg = await navigator.serviceWorker.getRegistration();
        if (reg) await reg.update().catch(() => {});
      }
    } catch (e) { /* 清不掉也照樣重載，至少會走網路 */ }
    const u = new URL(location.href);
    u.searchParams.set('_r', Date.now().toString(36));
    location.replace(u.toString());
  };
})();


/* 回到頂端 */
const topBtn = document.getElementById('top');
topBtn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
addEventListener('scroll', () => topBtn.classList.toggle('show', scrollY > 400), { passive: true });

/* service worker */
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
